# Ephemeral Postgres for `make test`/`make test-bare` — a non-default host port so a test run
# never collides with a developer's own local Postgres (e.g. one already on 5432 for a host
# project). Mirrors base-scaffold's docker-compose.test.yml (docs/APP-DESIGN.md §7.5): tmpfs
# data (RAM-backed, meaningfully faster, nothing to clean up between runs) and a healthcheck so
# `docker compose up -d --wait` actually blocks until Postgres is ready to accept connections.
services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: test_appkit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["55432:5432"]
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

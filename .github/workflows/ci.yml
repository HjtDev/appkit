# Thin caller — all real logic lives in the org-level reusable workflow (APP-DESIGN.md §10.1,
# §10.2). Never add job logic here; add an input to app-package-ci.yml instead.
#
# Ref pinning: @main while appkit is the only consumer of the reusable workflow — a workflow fix
# reaches this CI without a second PR in a second repo, and there is no other consumer to break.
# Once a second app package exists, cut a `v1` tag in HjtDev/.github and move every caller
# (including this one) to `@v1` — from that point a bad push to that repo's main would otherwise
# break every app's CI simultaneously with no staging step.
name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# The repo's default GITHUB_TOKEN permissions are read-only. app-package-ci.yml's publish-npm
# job requests id-token: write (for OIDC trusted publishing) — a reusable workflow's job can
# only downscope from what the CALLER grants, never escalate past it, so without this block the
# workflow_call fails validation before any job runs at all (a zero-job "startup_failure").
permissions:
  contents: read
  id-token: write

jobs:
  ci:
    uses: HjtDev/.github/.github/workflows/app-package-ci.yml@main
    with:
      package-name: appkit
      coverage-threshold: 95
      extras: "crypto images"
      postgres-db: test_appkit
      needs-redis: false
      check-migrations: false
      check-openapi-schema: false
      check-generated-types: false
      npm-workspace-root: "."
      wheel-must-contain: |
        appkit/py.typed
        appkit/locale/fa/LC_MESSAGES/django.mo
      forbid-runtime-dependencies: true
      # Publishes frontend/ to the npm registry as @hjtdev/appkit on a v* tag push, via OIDC
      # trusted publishing — no NPM_TOKEN anywhere (APP-DESIGN.md §11.1). One-time bootstrap
      # required before this does anything: see CHANGELOG.md's v1.0.1 entry.
      publish-npm: true
    secrets: inherit

  # PyPI publish lives HERE, in the caller, not in app-package-ci.yml — the one sanctioned
  # exception to "never add job logic here" (top-of-file note). PyPI's own docs state plainly
  # that a reusable workflow cannot be the workflow in a Trusted Publisher: the OIDC token's
  # `job_workflow_ref` claim for a `workflow_call` job resolves to the CALLEE
  # (HjtDev/.github/.github/workflows/app-package-ci.yml@…), never this file, so PyPI would
  # reject every mint-token request with invalid-publisher if this job lived in the reusable
  # workflow instead. npm has the opposite rule — it validates the CALLING workflow's name for
  # workflow_call — which is why publish-npm correctly stays in app-package-ci.yml. Do not
  # "fix" this asymmetry by moving one to match the other; both placements are already correct
  # for their own registry.
  #
  # Registered on pypi.org as project hjtdev-appkit, publisher repo HjtDev/appkit, workflow
  # ci.yml, environment publish-pypi — every field below must keep matching that configuration.
  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci]
    runs-on: ubuntu-latest
    environment: publish-pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv build
        working-directory: backend
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: backend/dist
          # Mirrors publish-npm's "already published — skipping" branch: the release that
          # bootstraps trusted publishing on a NEW PyPI project can still hit a re-run of this
          # exact tag, and failing on "file already exists" instead of skipping would turn a
          # recoverable re-run into a stuck release.
          skip-existing: true

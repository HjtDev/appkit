# Phase 6 playground — docs/APP-DESIGN.md §11.2. Postgres, Redis, both appkit halves wired by
# PATH (not by tag), and nginx in front of the backend — a deliberate addition beyond
# docs/CLAUDE-CODE-GUIDE-APP.md:370's "Postgres, Redis, both halves": client_ip is the highest-
# risk function in the package and cannot be meaningfully verified without a real proxy chain.
#
# Run from the REPO ROOT, not from playground/, so backend/frontend build contexts can see both
# appkit's own working tree and the playground consumer at once:
#   docker compose -f playground/docker-compose.yml up -d --wait

name: appkit-playground

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: playground
      POSTGRES_USER: playground
      POSTGRES_PASSWORD: playground
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playground -d playground"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Published for `tests/test_plugin_fixtures.py`, which runs from the LOCAL venv (not
    # `docker exec`) against the -p appkit.testing opt-in path — needs a reachable Postgres.
    ports: ["55434:5432"]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["63792:6379"]

  backend:
    build:
      context: ..
      dockerfile: playground/backend/Dockerfile
      args:
        PLAYGROUND_EXTRAS: ${PLAYGROUND_EXTRAS:-both}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: playground
      POSTGRES_USER: playground
      POSTGRES_PASSWORD: playground
      REDIS_URL: redis://redis:6379/0
      DEBUG: "false"
      DEMO_FERNET_KEY: ${DEMO_FERNET_KEY:?set DEMO_FERNET_KEY in playground/.env, see playground/README.md}
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend,nginx"
      CSRF_TRUSTED_ORIGINS: "http://localhost:8080,https://localhost:8443,http://localhost:3000"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports: ["8000:8000"] # direct access — bypasses nginx, used to isolate "is this nginx or Django"

  nginx:
    build:
      context: nginx
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "8080:8080"
      - "8443:8443"

  demo-sdk:
    # No standalone runtime — built as an image only so `docker compose build demo-sdk` proves
    # it compiles in CI-like isolation. frontend depends on it via a bind mount, not this image.
    build:
      context: ..
      dockerfile: playground/demo-sdk/Dockerfile
    profiles: ["build-check"]

  frontend:
    build:
      context: ..
      dockerfile: playground/frontend/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports: ["3000:3000"]
    depends_on:
      backend: { condition: service_healthy }

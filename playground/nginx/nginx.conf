# Fronts the backend only — appkit.net.client_ip and appkit.media.absolute_url are the two
# functions this playground's nginx exists to prove, both backend-side. The frontend is reached
# directly on its own port; nginx here stands in for docs/BASE-DESIGN.md §9's host-level nginx
# in front of a single upstream.

upstream backend_upstream {
    server backend:8000;
}

server {
    listen 8080;
    server_name _;

    # Set at SERVER level, not inside location / — nginx's proxy_set_header inheritance is
    # per-context: a sibling location block (below) that sets none of its own inherits these;
    # one that sets even one of its own would inherit NONE. Found live: with these only inside
    # `location /`, `location /healthz/` fell back to nginx's default Host header
    # ($proxy_host, i.e. the literal upstream name "backend_upstream"), which Django's
    # ALLOWED_HOSTS correctly rejected with a 400 — a bug only a real proxy chain surfaces.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    # $proxy_add_x_forwarded_for APPENDS this hop's own peer address to whatever
    # X-Forwarded-For it received — appkit.net.client_ip reads TRUSTED_PROXY_COUNT entries
    # from the RIGHT precisely because of this append semantics (docs/CONTRACT.md §2.10).
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location /healthz/ {
        # docs/BASE-DESIGN.md §9: "nginx must not expose /healthz/ publicly." Internal-only —
        # deny from anywhere except the Docker network this compose project uses.
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://backend_upstream;
    }

    location / {
        proxy_pass http://backend_upstream;
    }
}

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/playground.crt;
    ssl_certificate_key /etc/nginx/certs/playground.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location /healthz/ {
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://backend_upstream;
    }

    location / {
        proxy_pass http://backend_upstream;
    }
}
